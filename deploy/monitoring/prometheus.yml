global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: chat
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/chat_metrics_token
    static_configs:
      - targets: ["api:4020"]

  - job_name: vps
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
