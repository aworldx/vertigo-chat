x-api-environment: &api-environment
  API_ADDR: "0.0.0.0:4020"
  API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:?API_PUBLIC_ORIGIN must be set}
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
  OPENAI_BOT_MODEL: ${OPENAI_BOT_MODEL:-gpt-5.6-terra}
  OPENAI_BOT_RECEIVE_TIMEOUT_MS: ${OPENAI_BOT_RECEIVE_TIMEOUT_MS:-120000}
  OPENAI_BOT_DAILY_TOKEN_LIMIT: ${OPENAI_BOT_DAILY_TOKEN_LIMIT:-120000}
  OPENAI_BOT_TOKEN_WARNING_PERCENT: ${OPENAI_BOT_TOKEN_WARNING_PERCENT:-90}
  OPENAI_BOT_UTC_OFFSET_MINUTES: ${OPENAI_BOT_UTC_OFFSET_MINUTES:-180}
  CHAT_SESSION_GRACE_SECONDS: ${CHAT_SESSION_GRACE_SECONDS:-60}
  CHAT_HIDDEN_SESSION_GRACE_SECONDS: ${CHAT_HIDDEN_SESSION_GRACE_SECONDS:-300}
  CHAT_SESSIONS_INTERNAL_TOKEN: ${CHAT_SESSIONS_INTERNAL_TOKEN:-}
  METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set}
  S3_ENABLED: ${S3_ENABLED:-false}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  S3_VIRTUAL_HOSTED: ${S3_VIRTUAL_HOSTED:-false}
  MUSIC_PROXY_FILE: /run/secrets/music_proxies
  YOUTUBE_WORKER_URL: http://youtube-worker:4001

x-api-image: &api-image
  # Production images are published by GitLab CI. Keeping the build directive
  # out of this file makes an accidental VPS-side build impossible.
  image: ${CHAT_API_IMAGE:-chat-api}:${CHAT_API_IMAGE_TAG:-latest}
  environment: *api-environment
  volumes:
    - ${MUSIC_PROXY_HOST_FILE:-./.music_proxies}:/run/secrets/music_proxies:ro

x-youtube-worker-image: &youtube-worker-image
  image: ${CHAT_YOUTUBE_WORKER_IMAGE:-chat-youtube-worker}:${CHAT_YOUTUBE_WORKER_IMAGE_TAG:-latest}

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    <<: *api-image
    command: ["/app/bin/migrate"]
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4020/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  youtube-cache-init:
    <<: *youtube-worker-image
    user: "0:0"
    command:
      ["sh", "-c", "mkdir -p /var/cache/chat-youtube && chown -R 65534:65534 /var/cache/chat-youtube"]
    restart: "no"
    volumes:
      - youtube_cache:/var/cache/chat-youtube

  youtube-worker:
    <<: *youtube-worker-image
    restart: unless-stopped
    mem_limit: ${YOUTUBE_WORKER_MEM_LIMIT:-768m}
    cpus: ${YOUTUBE_WORKER_CPUS:-1.0}
    environment:
      YOUTUBE_WORKER_HOST: "0.0.0.0"
      YOUTUBE_WORKER_PORT: "4001"
      YOUTUBE_CACHE_DIR: /var/cache/chat-youtube
      YOUTUBE_CACHE_MAX_PREPARATIONS: ${YOUTUBE_CACHE_MAX_PREPARATIONS:-1}
      YOUTUBE_CACHE_MAX_BYTES: ${YOUTUBE_CACHE_MAX_BYTES:-2147483648}
    volumes:
      - youtube_cache:/var/cache/chat-youtube
    depends_on:
      youtube-cache-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      youtube-worker:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    logging: *default-logging
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${METRICS_TOKEN_FILE:?METRICS_TOKEN_FILE must be set}:/run/secrets/chat_metrics_token:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_SERVER_ROOT_URL: ${API_PUBLIC_ORIGIN:?API_PUBLIC_ORIGIN must be set}/monitoring/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  youtube_cache:
