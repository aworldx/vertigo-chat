<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Библиотека — эталон v2</title><link rel="stylesheet" href="/baseline.css"><link rel="stylesheet" href="/design.css"></head><body>
<div id="site-account" class="relative z-10 flex flex-wrap items-center justify-end gap-3 border-b border-zinc-800 bg-zinc-950 px-4 py-2 text-sm text-zinc-300"><span id="site-account-nickname">fixture01</span><a class="inline-flex min-h-11 items-center justify-center rounded-lg px-3 py-2 transition hover:bg-zinc-800 hover:text-amber-200 focus-visible:outline-2 focus-visible:outline-amber-300">Настройки аккаунта</a><form class="flex items-center"><button class="inline-flex min-h-11 items-center justify-center rounded-lg px-3 py-2 transition hover:bg-zinc-800 hover:text-amber-200 focus-visible:outline-2 focus-visible:outline-amber-300">Выйти с сайта</button></form></div>
<section id="library-page" class="library-shell chat-shell relative min-h-screen overflow-hidden text-stone-100" data-chat-theme="vertigo" data-chat-mode="dark">
<div class="library-reading-room" aria-hidden="true"></div>
<header class="relative z-10 flex min-h-16 items-center justify-between border-b border-amber-950/70 bg-stone-950/85 px-4 shadow-xl backdrop-blur-sm sm:px-8"><a class="flex items-center gap-3"><span class="vertigo-mark"></span><span class="vertigo-wordmark uppercase">Vertigo</span></a><a class="inline-flex min-h-11 items-center text-sm text-stone-400 transition hover:text-amber-200 focus-visible:text-amber-200">← Вернуться в чат</a></header>
<main class="library-main"><div class="library-intro"><div><p class="library-kicker">Читальный зал Vertigo</p><h1 class="library-title">Библиотека</h1><p class="library-description">Публичные тексты чатлан. Большие истории — по главам, короткие — за чашкой чая.</p></div><button class="library-create">Новая статья</button></div>
<div class="library-grid"><section class="library-feed"><div class="library-section-heading"><h2>Все статьи</h2><span>Сначала новые</span></div><div id="library-articles"></div></section>
<aside class="library-series-panel"><div class="library-series-head"><h2 class="library-series-title">Серии</h2><span class="library-series-count">1</span></div><a class="library-all" data-selected="true">Все статьи <span aria-hidden="true">↗</span></a><nav id="library-series"><a class="library-series-link"><img src="/images/library-cover-books.png" alt=""><span><strong>Хроники Vertigo</strong><small>fixture01</small><small>Статей: 3</small></span></a></nav></aside></div></main></section>
<script>
const fixtures=[{id:3,title:'Исправленная глава',part:3,date:'03.10.2026',body:'Проверка авторского редактора. Вторая строка.',cover:'window'},{id:2,title:'Продолжение',part:2,date:'02.09.2026',body:'Короткая история.',cover:'path'},{id:1,title:'Первая история',part:1,date:'01.09.2026',body:'Тихий вечер в читальном зале. '.repeat(20),cover:'books'}];
document.querySelector('#library-articles').innerHTML=fixtures.map(a=>`<article class="library-card"><div class="library-card-summary"><img class="library-cover" src="/images/library-cover-${a.cover}.png" alt=""><div class="library-card-copy"><a class="library-card-series">Хроники Vertigo · часть ${a.part}</a><h2 class="library-article-title">${a.title}</h2><div class="library-card-meta">${a.id===3?'<span>Автор: Uniform</span><span>Опубликовал: fixture01</span>':'<span>fixture01</span>'}<span aria-hidden="true">·</span><time>${a.date}</time></div><div class="library-excerpt"><div class="library-prose"><p>${a.body}</p></div></div><div class="library-card-actions"><button>Читать полностью <span aria-hidden="true">→</span></button><button class="library-edit">Редактировать</button></div></div></div></article>`).join('');
</script></body></html>
