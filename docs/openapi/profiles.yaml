openapi: 3.1.0
info:
  title: Vertigo public profile API
  version: 1.0.0
  description: Public fields already displayed by the profile catalogue. Read-only, no authentication required.
servers:
  - url: /
paths:
  /api/v1/profiles:
    get:
      operationId: listProfiles
      summary: Search profiles by nickname or name, ordered by nickname
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring search. Whitespace is trimmed. Existing SQL LIKE wildcard semantics apply.
          schema: {type: string, maxLength: 80, default: ""}
        - name: page
          in: query
          description: One-based page. Pages beyond the last page are clamped to the last page.
          schema: {type: integer, minimum: 1, maximum: 2147483647, default: 1}
      responses:
        '200':
          description: Matching profiles; an empty search result has data=[], total=0, page=1, total_pages=1. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 12
                    items: {$ref: '#/components/schemas/Profile'}
                  meta:
                    type: object
                    additionalProperties: false
                    required: [page, page_size, total, total_pages, query]
                    properties:
                      page: {type: integer, minimum: 1}
                      page_size: {type: integer, const: 12}
                      total: {type: integer, minimum: 0}
                      total_pages: {type: integer, minimum: 1}
                      query: {type: string, maxLength: 80}
        '422':
          description: invalid_params (invalid page, query type or length)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/profiles/{nickname}:
    get:
      operationId: getProfile
      summary: Get a public profile by its exact, URL-encoded nickname
      parameters:
        - name: nickname
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Public profile. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Profile'}
        '404':
          description: not_found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  schemas:
    Profile:
      type: object
      additionalProperties: false
      required: [nickname, name, gender, birth_date, about, photo_url, thumbnail_url, rank, progress]
      properties:
        nickname: {type: string}
        name: {type: [string, 'null']}
        gender: {type: [string, 'null'], enum: [male, female, other, null]}
        birth_date: {type: [string, 'null'], format: date}
        about: {type: [string, 'null'], description: Plain text; render as text, never HTML.}
        photo_url: {type: [string, 'null'], description: Relative URL of the existing photo endpoint or null.}
        thumbnail_url: {type: [string, 'null'], description: Relative thumbnail URL, falling back to photo_url.}
        rank:
          type: object
          additionalProperties: false
          required: [title, icon_url]
          properties:
            title: {type: string}
            icon_url: {type: string}
        progress:
          type: object
          additionalProperties: false
          required: [public_messages, chat_hours]
          properties:
            public_messages: {type: integer, minimum: 0}
            chat_hours: {type: integer, minimum: 0}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [invalid_params, not_found]}
            message: {type: string, description: User-facing Russian message. Branch on code, not message.}
