{
  "openapi": "3.1.0",
  "info": {
    "title": "Vertigo community API",
    "version": "1.0.0",
    "description": "Go-owned gallery. Account cookie identifies actor; CSRF required on mutations. Gallery uploads: Statist rank, 20 total, 5 in rolling 24h, 2MB original and optional 300KB thumbnail; JPEG/PNG/WebP signatures checked. Likes use idempotent desired state. Captions are trimmed and limited to 280 characters. All JSON uses no-store. Phoenix is comparison-only on an independent database. Library requires Kinoman rank, 50 total and 10 per rolling day; updates remain author-only. Admin database preview requires admin, emoji management requires admin or emoji_moderator on every operation. Games and Discourse SSO are excluded."
  },
