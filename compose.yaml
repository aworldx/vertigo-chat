x-app-environment: &app-environment
  PHX_HOST: ${PHX_HOST:?PHX_HOST must be set}
  PHX_SCHEME: ${PHX_SCHEME:-https}
  PHX_URL_PORT: ${PHX_URL_PORT:-443}
  PORT: "4000"
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set}
  DATABASE_URL: ecto://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
  POOL_SIZE: ${POOL_SIZE:-10}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
  OPENAI_BOT_MODEL: ${OPENAI_BOT_MODEL:-gpt-5.6-terra}
  OPENAI_BOT_RECEIVE_TIMEOUT_MS: ${OPENAI_BOT_RECEIVE_TIMEOUT_MS:-120000}
  OPENAI_BOT_DAILY_TOKEN_LIMIT: ${OPENAI_BOT_DAILY_TOKEN_LIMIT:-120000}
  OPENAI_BOT_TOKEN_WARNING_PERCENT: ${OPENAI_BOT_TOKEN_WARNING_PERCENT:-90}
  OPENAI_BOT_UTC_OFFSET_MINUTES: ${OPENAI_BOT_UTC_OFFSET_MINUTES:-180}
  CHAT_LOG_PATH: /var/log/chat/chat.log
  CHAT_LOG_MAX_BYTES: ${CHAT_LOG_MAX_BYTES:-10485760}
  CHAT_LOG_MAX_FILES: ${CHAT_LOG_MAX_FILES:-14}
  MUSIC_PROXY_FILE: /run/secrets/music_proxies

x-app-image: &app-image
  build:
    context: .
  image: chat-app:latest
  environment: *app-environment
  volumes:
    - ${MUSIC_PROXY_HOST_FILE:-./.music_proxies}:/run/secrets/music_proxies:ro
    - ${CHAT_LOG_DIR:-./logs}:/var/log/chat

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    <<: *app-image
    command: ["/app/bin/migrate"]
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app-image
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
