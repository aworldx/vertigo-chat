x-app-environment: &app-environment
  PHX_HOST: ${PHX_HOST:?PHX_HOST must be set}
  PHX_SCHEME: ${PHX_SCHEME:-https}
  PHX_URL_PORT: ${PHX_URL_PORT:-443}
  PORT: "4000"
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set}
  DATABASE_URL: ecto://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
  POOL_SIZE: ${POOL_SIZE:-10}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
  OPENAI_BOT_MODEL: ${OPENAI_BOT_MODEL:-gpt-5.6-terra}
  OPENAI_BOT_RECEIVE_TIMEOUT_MS: ${OPENAI_BOT_RECEIVE_TIMEOUT_MS:-120000}
  OPENAI_BOT_DAILY_TOKEN_LIMIT: ${OPENAI_BOT_DAILY_TOKEN_LIMIT:-120000}
  OPENAI_BOT_TOKEN_WARNING_PERCENT: ${OPENAI_BOT_TOKEN_WARNING_PERCENT:-90}
  OPENAI_BOT_UTC_OFFSET_MINUTES: ${OPENAI_BOT_UTC_OFFSET_MINUTES:-180}
  CHAT_LOG_PATH: /var/log/chat/chat.log
  CHAT_LOG_MAX_BYTES: ${CHAT_LOG_MAX_BYTES:-10485760}
  CHAT_LOG_MAX_FILES: ${CHAT_LOG_MAX_FILES:-14}
  CHAT_SESSION_DEBUG: ${CHAT_SESSION_DEBUG:-false}
  METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set}
  S3_ENABLED: ${S3_ENABLED:-false}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  S3_VIRTUAL_HOSTED: ${S3_VIRTUAL_HOSTED:-false}
  MUSIC_PROXY_FILE: /run/secrets/music_proxies
  DISCOURSE_CONNECT_SECRET: ${DISCOURSE_CONNECT_SECRET:-}
  YOUTUBE_CACHE_MAX_PREPARATIONS: ${YOUTUBE_CACHE_MAX_PREPARATIONS:-1}

x-app-image: &app-image
  # Production images are published by GitHub Actions. Keeping the build
  # directive out of this file makes an accidental VPS-side build impossible.
  image: ${CHAT_IMAGE:-chat-app}:${CHAT_IMAGE_TAG:-latest}
  environment: *app-environment
  volumes:
    - ${MUSIC_PROXY_HOST_FILE:-./.music_proxies}:/run/secrets/music_proxies:ro
    - ${CHAT_LOG_DIR:-./logs}:/var/log/chat

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    <<: *app-image
    command: ["/app/bin/migrate"]
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app-image
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  youtube-cache-init:
    image: ${CHAT_IMAGE:-chat-app}:${CHAT_IMAGE_TAG:-latest}
    user: "0:0"
    command:
      ["sh", "-c", "mkdir -p /var/cache/chat-youtube && chown -R 65534:65534 /var/cache/chat-youtube"]
    restart: "no"
    volumes:
      - youtube_cache:/var/cache/chat-youtube

  youtube-worker:
    <<: *app-image
    command: ["/app/bin/youtube-worker"]
    restart: unless-stopped
    mem_limit: ${YOUTUBE_WORKER_MEM_LIMIT:-768m}
    cpus: ${YOUTUBE_WORKER_CPUS:-1.0}
    environment:
      <<: *app-environment
      CHAT_RUNTIME_ROLE: youtube_worker
      YOUTUBE_WORKER_PORT: "4001"
      YOUTUBE_CACHE_DIR: /var/cache/chat-youtube
      YOUTUBE_CACHE_MAX_PREPARATIONS: ${YOUTUBE_CACHE_MAX_PREPARATIONS:-1}
    volumes:
      - youtube_cache:/var/cache/chat-youtube
    depends_on:
      youtube-cache-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  admin:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-environment
      CHAT_RUNTIME_ROLE: admin
      CHAT_LOG_PATH: /var/log/chat/admin.log
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      youtube-worker:
        condition: service_healthy

  # Exposes host CPU, RAM, disk and network data only to the Docker network.
  # Prometheus must be attached to that network; do not publish port 9100.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    logging: *default-logging
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave

  # Reads Docker cgroups to expose per-container resource usage to Prometheus.
  # It is reachable only inside the compose network; port 8080 is not published.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${METRICS_TOKEN_FILE:?METRICS_TOKEN_FILE must be set}:/run/secrets/chat_metrics_token:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_SERVER_ROOT_URL: ${PHX_SCHEME:-https}://${PHX_HOST:?PHX_HOST must be set}/monitoring/
      # Caddy removes /monitoring before proxying; root_url keeps generated
      # links and redirects under that public prefix.
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  youtube_cache:
