# Run script/check locally before pushing; CI only publishes production images.
stages:
  - build

build_production_image:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --name production-builder --use
    - |
      for target in api youtube-worker; do
        docker buildx build \
          --platform linux/amd64 \
          --target "$target" \
          --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache-$target \
          --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache \
          --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache-$target,mode=max \
          --tag "$CI_REGISTRY_IMAGE:$target-$CI_COMMIT_SHA" \
          --tag "$CI_REGISTRY_IMAGE:$target-main" \
          --push \
          -f deploy/docker/Dockerfile .
      done
