stages:
  - quality
  - build

quality:
  stage: quality
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker build --file deploy/docker/Dockerfile --target quality --tag chat-quality:$CI_COMMIT_SHA .
    - docker compose -f deploy/compose.yaml --env-file deploy/quality.env config --quiet
    - docker network create coverage
    - docker run -d --name coverage-postgres --network coverage -e POSTGRES_USER=coverage -e POSTGRES_PASSWORD=coverage -e POSTGRES_DB=postgres postgres:17
    - docker run --rm --network coverage -e COVERAGE_DATABASE_URL=postgresql://coverage:coverage@coverage-postgres/postgres --entrypoint /app/script/check-coverage chat-quality:$CI_COMMIT_SHA
    - docker run --rm --entrypoint /app/script/check-go chat-quality:$CI_COMMIT_SHA
    - docker run --rm --entrypoint sh chat-quality:$CI_COMMIT_SHA -c 'npm --prefix apps/web run typecheck && npm --prefix apps/web run lint && npm --prefix apps/web run format:check && npm --prefix apps/web test'

  after_script:
    - docker rm -f coverage-postgres || true
    - docker network rm coverage || true

build_production_image:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - quality
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --name production-builder --use
    - |
      for target in api youtube-worker; do
        docker buildx build \
          --platform linux/amd64 \
          --target "$target" \
          --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache \
          --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max \
          --tag "$CI_REGISTRY_IMAGE:$target-$CI_COMMIT_SHA" \
          --tag "$CI_REGISTRY_IMAGE:$target-main" \
          --push \
          -f deploy/docker/Dockerfile .
      done
